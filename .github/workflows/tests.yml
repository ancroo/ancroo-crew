name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests take under a minute. A hang shall not run into GitHub's limit of six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The same steps as in README, "Development". node is on the runner, so the page scripts are checked too.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest httpx2

      - name: Test
        run: .venv/bin/python -m pytest tests
