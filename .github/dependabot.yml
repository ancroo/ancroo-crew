# Keeps the pinned Python packages, the base images and the SHA-pinned actions current.
# Claude Code itself is not pinned: every deploy builds the image of the runs with the latest version.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directories: ["/", "/agent"]
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
