# Keeps the pinned Python packages, the base images and the SHA-pinned actions current.
# Claude Code itself is not pinned: every deploy builds the image of the runs with the latest version.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # Only propose releases that are at least a week old: hijacked packages
    # are usually caught and pulled within days, so the delay keeps them out.
    # Security updates ignore the cooldown and still arrive immediately.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directories: ["/", "/agent"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
